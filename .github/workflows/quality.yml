name: Greatsword Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: 'A/B cases per condition'
        type: choice
        options: ['1', '3', '6', '12']
        default: '3'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: greatsword-pages
  cancel-in-progress: false

jobs:
  static-quality:
    name: 01 · Skill and dataset gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill package
        id: skill
        continue-on-error: true
        run: python3 scripts/check_skill.py
      - name: Validate evaluation dataset
        id: dataset
        continue-on-error: true
        run: python3 scripts/check_dataset.py
      - name: Record dataset stage
        if: always()
        env:
          DATASET_OUTCOME: ${{ steps.dataset.outcome }}
        run: |
          mkdir -p build
          python3 -c 'import json,os;open("build/dataset-report.json","w").write(json.dumps({"gate":"dataset","status":"pass" if os.environ["DATASET_OUTCOME"]=="success" else "fail","outcome":os.environ["DATASET_OUTCOME"]},indent=2))'
      - name: Build installable Skill package
        if: always()
        run: |
          mkdir -p build
          tar -czf build/greatsword-skill.tar.gz -C skills greatsword
          tar -tzf build/greatsword-skill.tar.gz > build/package-manifest.txt
      - name: Static stage summary
        if: always()
        run: |
          echo '## 01 · Skill / dataset' >> "$GITHUB_STEP_SUMMARY"
          echo 'Skill: ${{ steps.skill.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dataset: ${{ steps.dataset.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greatsword-quality-${{ github.run_id }}
          path: |
            build/quality-report.json
            build/dataset-report.json
            build/package-manifest.txt
            build/greatsword-skill.tar.gz
          retention-days: 90
      - name: Enforce quality gates
        if: ${{ steps.skill.outcome != 'success' || steps.dataset.outcome != 'success' }}
        run: exit 1

  model-eval:
    # Independent: never blocks Pages deployment.
    name: 02 · Docker / same-model A-B
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build evaluation image
        id: docker
        continue-on-error: true
        run: |
          docker build -f evals/opencode/Dockerfile -t greatsword-opencode:ci .
          docker run --rm --entrypoint opencode greatsword-opencode:ci --version
          docker run --rm --entrypoint opencode greatsword-opencode:ci run --help
      - name: Evaluate free models in order
        id: ab
        if: ${{ steps.docker.outcome == 'success' }}
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          mkdir -p build/opencode
          timeout --signal=TERM --kill-after=20s 900s docker run --rm \
            -e OPENCODE_API_KEY \
            -e EVAL_LIMIT="${{ inputs.limit || '3' }}" \
            -v "$PWD/build/opencode:/reports" \
            --entrypoint python3 greatsword-opencode:ci \
            evals/opencode/select_model.py
      - name: Record A/B timeout or failure
        if: always()
        env:
          AB_OUTCOME: ${{ steps.ab.outcome }}
        run: |
          mkdir -p build/opencode
          python3 -c 'import json,os,pathlib;p=pathlib.Path("build/opencode/execution-status.json");p.write_text(json.dumps({"stage":"model-eval","outcome":os.getenv("AB_OUTCOME","unknown"),"timeout_seconds":900},indent=2))'
      - name: Generate truthful A/B report
        if: always()
        env:
          DOCKER_SMOKE_PASSED: ${{ steps.docker.outcome == 'success' }}
        run: python3 evals/opencode/ci_report.py
      - name: A/B stage summary
        if: always()
        run: |
          echo '## 02 · OpenCode A/B' >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,os;p=json.load(open("build/opencode/ci-report.json"));print("Selected model:",p.get("selected_model") or "NONE");print("Status:",p["status"]);print("Attempts:",len(p.get("attempted_models",[])))' | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'CLI execution is not an engineering-quality score.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish A/B results at stable branch path
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/ab-published/latest
          cp build/opencode/ci-report.json build/ab-published/latest/ci-report.json 2>/dev/null || printf '{"status":"not_run","selected_model":null,"attempted_models":[]}' > build/ab-published/latest/ci-report.json
          cp build/opencode/ci-report.html build/ab-published/latest/ci-report.html 2>/dev/null || true
          cp build/opencode/model-selection.json build/ab-published/latest/model-selection.json 2>/dev/null || true
          python3 -c 'import json,os;from pathlib import Path;p=Path("build/ab-published/latest/metadata.json");p.write_text(json.dumps({"run_id":os.getenv("GITHUB_RUN_ID"),"sha":os.getenv("GITHUB_SHA")}))'
      - name: Commit stable A/B result
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/ab-published
          publish_branch: ab-results
          keep_files: false
          enable_jekyll: false
      - name: Upload complete model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greatsword-model-${{ github.run_id }}
          path: build/opencode/
          if-no-files-found: warn
          retention-days: 90

  publish-pages:
    name: 03 · Publish report archive
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [static-quality]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: greatsword-quality-${{ github.run_id }}
          path: build/
      - name: Generate landing and per-run reports
        run: python3 scripts/build_site.py
      - name: Restore earlier published run reports
        run: |
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            mkdir -p /tmp/greatsword-previous
            if git ls-tree -d --name-only origin/gh-pages reports | grep -qx reports; then
              git archive origin/gh-pages reports | tar -x -C /tmp/greatsword-previous
              cp -rn /tmp/greatsword-previous/reports/. public/reports/
            fi
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Published report links
        run: |
          echo '## 03 · Pages' >> "$GITHUB_STEP_SUMMARY"
          echo 'Landing: https://fangfengxiang.github.io/greatsword/' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run: https://fangfengxiang.github.io/greatsword/reports/${{ github.run_id }}/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pages must be enabled with GitHub Actions as its build and deployment source.' >> "$GITHUB_STEP_SUMMARY"
