name: OpenCode Docker Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model ID; blank uses OPENCODE_EVAL_MODEL repository variable'
        required: false
        default: ''
        type: string
      limit:
        description: 'Cases per condition'
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '6', '12']

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark and Skill
        run: |
          python3 scripts/check_skill.py
          python3 scripts/check_dataset.py
      - name: Build OpenCode evaluation container
        run: docker build -f evals/opencode/Dockerfile -t greatsword-opencode:ci .
      - name: Verify installed OpenCode inside Docker
        run: |
          docker run --rm --entrypoint opencode greatsword-opencode:ci --version
          docker run --rm --entrypoint opencode greatsword-opencode:ci run --help
      - name: Verify Python runner CLI inside Docker
        run: docker run --rm greatsword-opencode:ci --help
      - name: Produce smoke-only report
        if: always()
        env:
          DOCKER_SMOKE_PASSED: ${{ job.status == 'success' }}
        run: python3 evals/opencode/ci_report.py
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-smoke-${{ github.run_id }}
          path: |
            build/opencode/ci-report.json
            build/opencode/ci-report.html
          if-no-files-found: warn
          retention-days: 30

  model-eval:
    needs: docker-smoke
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENCODE_MODEL: ${{ inputs.model || vars.OPENCODE_EVAL_MODEL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover free models and run first successful A/B
        shell: bash
        run: |
          mkdir -p build/opencode
          docker build -f evals/opencode/Dockerfile -t greatsword-opencode:ci .
          docker run --rm \
            -e OPENCODE_API_KEY \
            -e EVAL_LIMIT="${{ inputs.limit || '3' }}" \
            -v "$PWD/build/opencode:/reports" \
            --entrypoint python3 greatsword-opencode:ci \
            evals/opencode/select_model.py
      - name: Generate combined HTML and JSON report
        if: always()
        env:
          DOCKER_SMOKE_PASSED: 'true'
        run: python3 evals/opencode/ci_report.py
      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          echo "## OpenCode A/B evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: \`$OPENCODE_MODEL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the opencode-model artifact for the standalone HTML and JSON report." >> "$GITHUB_STEP_SUMMARY"
          cat build/opencode/ci-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Archive HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-model-${{ github.run_id }}
          path: build/opencode/
          if-no-files-found: warn
          retention-days: 30
