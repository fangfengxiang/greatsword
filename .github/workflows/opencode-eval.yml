name: OpenCode A-B Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Exact available OpenCode model ID; select from your connected catalog'
        required: true
        type: string
      limit:
        description: 'Development scenarios per condition (1-12)'
        required: true
        default: '3'
        type: choice
        options: ['1', '3', '6', '12']

permissions:
  contents: read

jobs:
  opencode-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenCode CLI v2
        run: npm install -g @opencode/cli
      - name: Check CLI
        run: |
          opencode --version
          opencode run --help
      - name: Validate benchmark and skill
        run: |
          python scripts/check_skill.py
          python scripts/check_dataset.py
      - name: Run both conditions with identical model
        shell: bash
        run: |
          set +e
          python evals/opencode/run.py --model "${{ inputs.model }}" --condition baseline --limit "${{ inputs.limit }}" --output build/opencode
          baseline=$?
          python evals/opencode/run.py --model "${{ inputs.model }}" --condition greatsword --limit "${{ inputs.limit }}" --output build/opencode
          candidate=$?
          echo "baseline_exit=$baseline candidate_exit=$candidate"
          if [ "$baseline" -ne 0 ] || [ "$candidate" -ne 0 ]; then exit 1; fi
      - name: Archive evidence and HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-ab-${{ github.run_id }}
          path: build/opencode/
          if-no-files-found: warn
          retention-days: 30
